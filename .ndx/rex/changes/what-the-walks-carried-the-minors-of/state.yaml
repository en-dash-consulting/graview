  "96270440-4713-4dd5-948b-f9c42da3644d":
    status: "completed"
    startedAt: "2026-10-21T14:00:00.000Z"
    completedAt: "2026-10-21T21:20:00.000Z"
    endedAt: "2026-10-21T21:20:00.000Z"
    resolutionType: "code-change"
    resolutionDetail: "Relate on the pages: a record's acts are one Tab stop (useRoving, letters) on the derived record and todo's, rota's and the discography's designs, and an act's form opened takes the keyboard to the field it asks (DerivedForm autoFocus; Repairs too) — todo 10→8, rota 14→8 for the pointer's 4; seedbed (every form drawn open, 11 vs 3) and the discography (two acts begin with P, 9 vs 4, was 16) keep app-scoped reasons. Undo on the scene: the offer's Take back says ⌘Z (NoticeAction.keys → aria-keyshortcuts), and the journeys press it — 8–10→1 for 2; undo/scene left KEYBOARD_WHY. Refused on the scene: the keyboard goes to the district by name through Find (as narrow does) and presses its acts key — discography 12→4 for 2, rota 9→4; Find now lands on the first drawn control of the arranging line (on a phone Sort is folded). Repair on the pages: a repair's question takes the keyboard (rota 13→11, gauntlet 15→14) but the problems stay a page across the bar, and its reason stays, reworded; refused split into refused/scene (a record chosen from the address, 3 vs 1) and refused/pages (a place on the bar). Tests: packages/pages/tests/unit/an-act-opened-takes-the-keyboard-to-what-it-asks.test.tsx, the-scene-offers-the-way-back and find-costs-the-keyboard tests in primitives, tests/journeys.test.ts (all failing first)."
    lastModified: "2026-10-21T21:20:00.000Z"
    lastModifiedBy: "Nick Daniel <nick@endash.us>"
  "b7ce8897-6e9d-478e-8dee-9d3009987f51":
    status: "completed"
    startedAt: "2026-10-20T07:37:49.000Z"
    completedAt: "2026-10-20T07:37:49.000Z"
    endedAt: "2026-10-20T07:37:49.000Z"
    resolutionType: "code-change"
    resolutionDetail: "The strip's preview of a press tells the watch when the act's own input refuses it: previewAffordance takes { pressed: { author } } and calls tellTheWatchOfAPressRefusedByItsInput (packages/core/src/watched.ts, on @graview/core); useApplyAffordance's preview (the scene strip and the kind stop) and the quick ask pass it. A preview before any press tells nothing; a form filled wrongly stays exempt by the watch's origin rule. Criteria: packages/primitives/tests/unit/the-scene-strip-tells-the-watch-when-an-acts-own-input-refuses.test.tsx and pnpm verify watch's aPressTheStripsPreviewRefusesIsCaught (both verified failing without the fix); pnpm verify navigation --quick holds."
    lastModified: "2026-10-20T07:37:49.000Z"
    lastModifiedBy: "Nick Daniel <nick@endash.us>"
