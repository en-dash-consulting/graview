    resolutionDetail: "Third walk, stage F: two roles declared in walk3 (keeper, helper) handed to defineApp and the Store, a principal on the provider with ?seat=helper to sit in the narrower one, and both seats on the embed. Verified: the narrower seat sees every act it may not take struck through with the policy's own sentence in the strip, the routed face and the day book, nothing hidden and nothing refusing on press; the agent's tool list is exactly that seat's acts (asserted as an exact list, derived edits included) and a call outside it is refused at the store with the same sentence and no op; a human's and an agent's diff are identical; changing seats on the embed keeps the store and what was done before the switch. One finding: W-062, the record page the scaffolder writes reading affordances and never withheld, so declaring a policy made whole sections vanish for the narrower seat — fixed in packages/core/src/scaffold/index.ts with a scaffold.test criterion verified failing first. Stage re-run clean: axe 0 across 68 screens, audit clean over the scene's 20 states and the design's 24, and the whole harness list passes."
