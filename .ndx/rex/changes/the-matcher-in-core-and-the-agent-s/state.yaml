    resolutionDetail: "packages/core/src/search.ts: search(store, query, {principal, from, subject, places, flagged, today, limit}) → {hits (node|kind|place|act|rule, each with why {field, reading, fragment, strength}), words, conditions (admittedBy), searched {kinds, past}, byKind, total}. fold/squeeze/strengthOf (every word the start of a word; exact/prefix on the squeezed whole), parseQuery (key:value → arrangement conditions via conditionHolds, kind:, is:), matchNode over label + readableFields, touchWeights (op-log writes, decayed), searchableFields. Past excluded unless is:any/is:past. Acts only with subject, judged on the words their title carries. arrange's matches() now uses matchNode + q conditions. search_graph first read tool (reads = node hit ids; places option on the runtime, wired in chat, agent seat and graview mcp); MCP instructions say search before get_graph. describe '## What can be found', llms.txt 'searched by' + '## Finding a thing'. Tests: core one-matcher-finds-it (worked example + awkwardApp properties), tools an-agent-finds-by-name."
