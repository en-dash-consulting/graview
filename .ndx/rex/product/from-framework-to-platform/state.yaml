    resolutionType: "code-change"
    resolutionDetail: "@graview/studio: a meta-schema (kind, field, edge, act, rule, role, grant, lens, brand) declared with defineNode; declarationToGraph reads an app in with stable ids; the acts (add/rename/remove-kind, add/remove-field, add/remove-edge, add/remove-act, add/remove-rule, name/forget-repair, add-role, grant, revoke-grant, plus derived edits) change it as ops with author, intent and inverse, undone like any other; graphToDeclaration gives back a checkable, runnable app (the checkout's act bodies and rule judgements kept by name; a studio-declared act gets a body from create/connect/sever/write); createStudio.check() runs graview check and apply() refuses on errors, else returns the new app and migrationBetween's migration (remove-kind, remove-field, remove-edge, start-field); files() writes src/domain/schema|mutations|invariants|policy.ts and a test imports them as a checkout and checks and runs them; propose/proposals/decline for an agent seat; createStudioLens is the place \"What the checker says\". Seedbed chapter 15 \"The studio\" is live on the page with progression criterion theDeclarationIsAGraphInChapterFifteen; skill graview-studio. Limits stated in the skill: a rule the studio declares judges nothing until the checkout writes its evaluate; a hand-written act body is the checkout's to keep when the files are written back; applying to a running app on the page is by remount, not shown in the chapter."
    metAt: "f6da6ba61f04d99a79bbeaf0a894e308a4a92f3d5a400d036c2c97329195758f"
    lastModified: "2026-09-12T16:16:46.522Z"
    lastModifiedBy: "Nick Daniel <nick@endash.us>"
  "78e28762-ba91-4a45-abdd-0ff9aa43d2d2":
    status: "completed"
    startedAt: "2026-09-13T07:20:27.099Z"
    completedAt: "2026-09-13T07:20:27.099Z"
    endedAt: "2026-09-13T07:20:27.099Z"
    resolutionType: "code-change"
    resolutionDetail: "`graview serve` in @graview/ship hosts a store behind HTTP with the op log as the wire: clients send calls (never primitives) and the server applies them through an ordinary Store under the request's principal, so the same policy refuses with the same sentence. File adapter by default (snapshot.json, a greppable log.jsonl, meta.json); --sqlite swaps it with nothing else changing; migrations run on the server once; /graview/health says which adapter and where. openRemote is the browser side: a real Store whose calls go to the server, whose graph receives everybody else's ops on a poll, applying optimistically and taking a refusal back as the same person. Store.receive is the new core primitive — a foreign op is not re-judged, not re-minted (a client's ids are prefixed; two stores both starting at op1 meant a client silently dropped the server's op) and renumbered into the local log's contiguous order. Rota runs on it with ?server=…; the launcher answers server-side persistence from the declaration rather than by assertion. verify-served drives the folder, a browser change landing on disk, the other browser hearing it on its own poll, a server restart, and the viewer's refusal; 10 integration tests in ship cover the wire. 850 tests, graview check on four apps, smoke-create and the suite green. Not done: a stop in the launcher that shows the folder's contents beside the picture — the capability is listed and the harness reads the folder, but the desk does not draw it."
    metAt: "5759d04a84cbf746ca22acb553caa020dd8688ef47e857a5c208e4bf3c484113"
    lastModified: "2026-09-13T07:20:27.112Z"
    lastModifiedBy: "Nick Daniel <nick@endash.us>"
  "92cf1711-1b84-4cb9-865f-a5547a25a96d":
