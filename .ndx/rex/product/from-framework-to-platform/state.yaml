    resolutionType: "code-change"
    resolutionDetail: "Declarative resource mapping, inbound changes as ordinary ops with a system author, echo suppression via the version the remote produced for our own write, conflicts as violations with repairs, offline degrading to local-only and reconciling. Google Calendar transport included and the household example's mapping declared. ONE CRITERION IS NOT MET: it has never run against a real Google account — the household example/scripts/sync-google.mjs is runnable and read-only by default, and the README says the claim is unverified until somebody runs it."
    metAt: "3fbabf823e0be14e44462da92ed40bde833ea8fd4798b63f1366bf0c9e19e19f"
  "aab02be9-0716-498d-8200-210edcd020f0":
