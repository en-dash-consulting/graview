    resolutionType: "code-change"
    resolutionDetail: "createCalendarLens in @graview/primitives: month/week/day/agenda over real dates, bound by roles (start, end, allDay, label, done) and declared so graview check reads the binding. Multi-day spans on every day they cover, \"+N more\" that opens the day, all-day before timed, done struck, every entry a pick target that the strip acts on and a rule flags. Date arithmetic on YYYY-MM-DD via Date.UTC. Two framework capabilities it forced: ViewState.within (a view's own place in the stop, written as in.<key>, counted as travelling so Back returns to the month you left) and addressable places (places() lists every titled group view with an `as` slug; resolve(kind, cell, as) picks one) — before which a second titled registration simply replaced the first. Also fixed: a control inside a view no longer selects the card it is drawn on. Things shows the month beside the week and the lists (all three the framework's named places, its own switcher removed); Seedbed gains a season and a harvest date; the launcher lists the calendar. verify-calendar (5 criteria), audit-ui + survey calendar/agenda/season states (24/24 clean), axe on the month at 390 and 1280 in both schemes, 823 unit tests and the whole suite green. Rota's shift calendar lands with Rota (a4b680fd)."
    metAt: "d4f566596c05cd9cee6a78a45b29e5ebaedcddbcffeca0bf5029a336c7e47f08"
