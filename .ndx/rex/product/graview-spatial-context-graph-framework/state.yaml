    completedAt: "2026-09-13T05:23:00.647Z"
    endedAt: "2026-09-13T05:23:00.647Z"
    resolutionType: "code-change"
    resolutionDetail: "deriveAffordances takes a `focus` (the node the gesture landed on) and ranks by it: the clicked thing's repairs first in the rule's own order, then a repair merely implicating it, then its own acts (settled before asking), then the rest. Which node an act is FOR is read off the mutation's nodeRef args, not the violation's cast list; repairs carry their violation's subjectId. One `rank` stamped on every affordance and read by the pointer menu (PointerMenu.on), the actions strip (focus = last selected) and the routed record (rankedRepairs). verify-menu drives the two-problem case from the scene, the record and the problems inbox; audit-ui gains a `menu` state. 789 unit tests, menu/pages/navigation/chat/remember/seat harnesses and audit-ui all green."
    metAt: "de98f7a9f350f0b41c940eb24d1a0389fb2c07347e073b99145fa8bb86330e34"
    lastModified: "2026-09-13T05:23:00.659Z"
