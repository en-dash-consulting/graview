<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Graview's micro mark: navy on paper, white in a dark scheme (the SVG says which); the ICO and the touch icon where an SVG is not taken. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<title>Things — a Graview example</title>
<style>
  /* The theme is injected by src/main.tsx from the declared brand, so the
     tokens have one home. This is only the pre-paint ground, so the page never
     flashes white before the stylesheet lands. */
  html, body { margin: 0; background: #0a0b10; color: #eceef5; }
</style>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
