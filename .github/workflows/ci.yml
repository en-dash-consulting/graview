name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow dispatches this on the Version packages branch: a pull
  # request its own token opened starts no workflow, and main's rules need
  # these checks on every pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs the history to tell what has changed since main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A host that is not Node imports the framework too. The published
      # entries of core, tools and ship's runtime, bundled as a Worker and run
      # in workerd with no Node compatibility: a call applied, the wire served
      # from a Durable Object, the adapter contract over its SQLite. `pnpm
      # test` skips this where workerd cannot start; here it must run (FR-09).
      - name: Run core, tools and ship in workerd
        run: pnpm vitest run tests/the-framework-runs-in-workerd.test.ts
        env:
          GRAVIEW_REQUIRE_WORKERD: "1"

      # The declaration is the contract. An app that typechecks can still
      # declare an edge to a kind nobody wrote, a rule with no invariant, or a
      # palette nobody can read.
      - name: graview check
        run: pnpm check

      # What would actually go in a tarball. A `files` allowlist is a claim,
      # and the way it fails is silent.
      - name: Inspect the packed tarballs
        run: node scripts/inspect-pack.mjs

      # And whether a stranger can install them. Inside the workspace every
      # import resolves through a symlink and a path mapping, so an exports
      # map can be wrong for a year and nothing else notices.
      - name: Build a scratch app from the tarballs
        run: node scripts/smoke-install.mjs

      # And whether the ONBOARDING works: `graview create` writes a project,
      # the project installs from the tarballs, its own `verify` passes, the
      # skills land, and a real browser opens it — because "it typechecks"
      # is not "it runs". Then the same by path, the way the first-party
      # products consume the framework.
      - name: A browser for the scaffolded app
        run: npx playwright install --with-deps chromium
      - name: Scaffold a project, install it, verify it, open it
        run: node scripts/smoke-create.mjs

      # The example the docs teach from, grown a chapter at a time, each
      # chapter opened in a browser: a chapter that stops holding its claim
      # fails the build rather than the page.
      - name: Photograph the progression
        run: node scripts/progression.mjs

  changeset:
    # A version bump is a decision, and one nobody made is one nobody can
    # explain later. This asks for it while the change is still in front of
    # the person who made it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A package change needs a changeset
        run: node scripts/require-changeset.mjs
