# Releases, carried by the batch that brings them.
#
# 1. A batch pull request carries its own release. `pnpm release:prepare`
#    (scripts/release-prepare.mjs), run on the batch branch, spends the
#    changesets, bumps the fourteen packages, writes the changelogs, keeps or
#    scaffolds the version's record in apps/site/releases.json and rebuilds
#    the site. The batch's CI and its Nightly, dispatched on its head after
#    that, are the release's gates.
# 2. Every push to main runs this. The `version` job asks
#    `scripts/release-state.mjs` what the push releases (the rules are in
#    scripts/lib/release.mjs, and tests/a-release-runs-only-when-its-gates-hold.test.ts
#    holds them):
#    - a changeset pending on main (a pull request merged outside a batch):
#      it opens or updates the "Version packages" pull request, as before, and
#      dispatches CI on its branch, since a pull request this workflow's token
#      opens starts no workflow of its own. Nothing is stranded: that pull
#      request's merge is then released like a batch's;
#    - nothing pending and a package at the version npm does not have: the
#      `publish` job, but only when a green Nightly ran on this very tree
#      (`git rev-parse HEAD^{tree}` against the tree of the commit it ran on),
#      so a merge of a green batch that conflicts with nothing counts. Without
#      one the run fails and says to dispatch Nightly on main;
#    - nothing pending and everything on npm: nothing.
# 3. The `publish` job runs in the `npm` environment, whose required reviewer
#    approves it once in GitHub. That approval is the release: nothing reaches
#    npm before it. Approved, it asks the gate again, builds and tests,
#    publishes every package by npm trusted publishing
#    (`scripts/release-publish.mjs`), then tags each and writes a GitHub
#    release. Re-running it finishes a release that stopped part way.
#
# The fourteen packages are one changesets `fixed` group, so they share a
# version and `graview create` can write `^<version>` for every one of them
# and name a version that exists.
#
# Trusted publishing (OIDC): no long-lived token in this repository. Each
# package's trusted publisher on npmjs.com names this repository, this file and
# the "npm" environment, and allows publish (`node scripts/release-trust.mjs`
# sets that). A brand-new package has no trusted publisher until it exists, so
# its first version is published by hand.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Dispatches CI on the Version packages branch, and reads the Nightly runs.
      actions: write
    outputs:
      path: ${{ steps.state.outputs.path }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: What this push releases
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-state.mjs

      # The version step regenerates the site's numbers and docs pages (they
      # name the release, and its llms files and structured data with them),
      # and the docs generator reads the built packages.
      - name: Build, for the site the version step regenerates
        if: steps.state.outputs.path == 'version-pr'
        run: pnpm build

      # changesets/action@v2, not v1: v1 learned what was published by scraping
      # `New tag:` lines that @changesets/cli v3 no longer prints. Here it only
      # versions; publishing is the next job's.
      - name: Open or update the Version packages pull request
        if: steps.state.outputs.path == 'version-pr'
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: "Version packages"
          commit-message: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI on it
        if: steps.state.outputs.path == 'version-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref changeset-release/main

      # With nothing pending on main, a Version packages pull request still
      # open was opened for changesets a batch has since spent: merged, it
      # would version them a second time.
      - name: Close a Version packages pull request nothing is pending for
        if: steps.state.outputs.path == 'publish' || steps.state.outputs.path == 'nothing'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for NUMBER in $(gh pr list --head changeset-release/main --state open --json number --jq '.[].number'); do
            gh pr close "${NUMBER}" --comment "No changeset is pending on main at ${GITHUB_SHA}: a batch released what this pull request would have versioned."
          done

  publish:
    needs: version
    if: needs.version.outputs.path == 'publish'
    runs-on: ubuntu-24.04
    # The required reviewer on this environment is the release's one approval.
    environment: npm
    # The tests take about 12 minutes before anything is published, and one
    # slow registry PUT took 8 on 2026-10-22; 30 cut that release in half.
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      # Reads the Nightly runs, for the gate.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Asked again after the approval, which can come days later: still
      # nothing pending, one version, and a green Nightly on this tree. It
      # does not ask npm, so a re-run after a partial publish goes on.
      - name: A green Nightly ran on this tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-state.mjs --gate

      # Trusted publishing and provenance need npm 11.5.1 or later; node 22
      # ships 10.x. Pinned to 11.15.0 because 11.16.0 broke `npm info`
      # against npmjs.org metadata.
      - name: npm that can do trusted publishing
        run: npm install -g npm@11.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The apps compile under typecheck (`tsc -b` over packages and apps), and
      # tests that typecheck Seedbed or read the launcher need the rota app's
      # output. CI runs it first; without it here, `pnpm test` failed on a
      # clean runner with "Cannot find module '@graview/rota'".
      - run: pnpm typecheck
      - run: pnpm test

      - name: Publish, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-publish.mjs

      - name: The tags and releases match what npm has
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/graview/package.json').version")
          FAILED=0
          for dir in packages/*/; do
            NAME=$(node -p "require('./${dir}package.json').name")
            TAG="${NAME}@${VERSION}"
            # npm takes a few minutes to serve a version it has just taken.
            SERVED=0
            for TRY in $(seq 1 30); do
              if npm view "${TAG}" version --prefer-online >/dev/null 2>&1; then SERVED=1; break; fi
              sleep 20
            done
            if [ "$SERVED" = 0 ]; then
              echo "::error::${TAG} is not on npm after ten minutes"; FAILED=1
            fi
            if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
              echo "::error::no tag ${TAG} on origin"; FAILED=1
            fi
            if ! gh release view "${TAG}" >/dev/null 2>&1; then
              echo "::error::no GitHub release ${TAG}"; FAILED=1
            fi
          done
          exit $FAILED
