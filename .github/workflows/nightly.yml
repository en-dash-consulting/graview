# The browser harnesses, every night, and red when a claim stops holding.
#
# CI on a push runs the tests, the checker, the tarballs, the scaffold and
# the progression. The rest of the harness chain — every screen judged by
# the watch, the site, the pages face at phone width, the survey, the audit
# — ran only when somebody remembered to, and a red verdict sat in
# docs/*.json for days: the site's kit check broke on main on 2026-09-29 and
# nobody heard until a walk's review a day later. This is the run nobody has
# to remember, and the release workflow will not publish while it is red.
#
# Chromium every night, across nine runners at once; WebKit and Firefox
# once a week, through `pnpm engines`, on a runner of their own. `shrunk`, `panning` and `scale` are left out: the GPU capture
# path needs Chrome Canary, and the other two time frames against a GPU the
# runner does not have.
#
# BOTH PATHS, where they differ. The scene draws on the GPU where a browser
# can capture into WebGPU and on the DOM path elsewhere. Eight shards run
# with GRAVIEW_RENDERER=dom; one runs with GRAVIEW_RENDERER=gpu in
# Google Chrome with element capture switched on and WebGPU on SwiftShader
# (engine.mjs's GPU_ARGS). A runner whose Chrome cannot make an adapter, or
# whose hit-testing ignores the drawn geometry (Chrome 155's
# `layoutSubtree` build, where a press on a drawn view missed it:
# `gpuCapturePresent`), draws on the DOM path, and `renderer` says so in
# docs/renderer.json (`gpu.unavailable`) rather than claiming the GPU held.
# Until stable Chrome ships the paint-record build, that leg holds that
# such a browser falls back to the DOM path and still works.
#
# A harness that fails is looked at again alone before the shard goes red
# (scripts/lib/second-look.mjs); one that held the second time is written
# to docs/flakes.json, uploaded with the verdicts, and raised as a warning.

name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
    # Monday's run also takes the other two engines.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      engines:
        description: "Also run pnpm engines (WebKit and Firefox)"
        type: boolean
        default: false

concurrency:
  # One run at a time per branch: a branch's Nightly before its merge no
  # longer waits behind, or is canceled by, another branch's.
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # SHARDS SIDE BY SIDE, balanced by the harness times of 2026-10-18's run
  # on main (site 823s, gauntlet 721s, journeys on todo, seedbed, rota and
  # discography 808s together, a11y 261s, audit 221s, pages 198s, lines
  # 179s): the slowest shard is ~14 minutes of harness, not 26. Each shard
  # is its own machine, so its ports and its CPU are its own; within a
  # shard the harnesses run one at a time.
  #
  # THE GPU LEG IS ONE SHARD. On the runner's Chrome stable the scene draws
  # on the DOM path (docs/renderer.json says so: its capture hit-tests where
  # a view was laid out), so running every shard again there ran the same
  # DOM checks in a slower Chrome on a busier machine: twice the runners,
  # 26 minutes on its slowest shard, and every flake of 0.1.34's merge. What
  # only that leg can hold is that such a browser falls back and still
  # works: `renderer` holds it, and the scene's own harnesses (navigation,
  # menu, quick-ask) prove the fallback draws and answers. When stable
  # Chrome draws on the GPU, widen this shard again.
  harnesses:
    name: ${{ matrix.shard }} (${{ matrix.renderer }})
    runs-on: ubuntu-24.04
    # 75: installing the engines alone has taken 32–42 minutes on a slow day.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { renderer: dom, shard: "site", run: "node scripts/verify-all.mjs --serial site" }
          - { renderer: dom, shard: "gauntlet", run: "node scripts/verify-all.mjs --serial gauntlet" }
          - { renderer: dom, shard: "audit, survey, create, quick-ask, menu", run: "node scripts/verify-all.mjs --serial audit survey create quick-ask menu" }
          - { renderer: dom, shard: "a11y, lines, pages, navigation, scene-hands", run: "node scripts/verify-all.mjs --serial a11y lines pages navigation scene-hands" }
          # address joined after it failed on main from 2026-10-15 to 10-19 with no Nightly to say so.
          - { renderer: dom, shard: "rota, calendar, desk, remember, studio, watch, who, seat, rehearsal, renderer, address", run: "node scripts/verify-all.mjs --serial rota calendar desk remember studio watch who seat rehearsal renderer address" }
          - { renderer: dom, shard: "journeys (gauntlet)", run: "node scripts/verify-journeys.mjs gauntlet" }
          - { renderer: dom, shard: "journeys (todo, seedbed)", run: "node scripts/verify-journeys.mjs todo seedbed" }
          - { renderer: dom, shard: "journeys (rota, discography)", run: "node scripts/verify-journeys.mjs rota discography" }
          - { renderer: gpu, shard: "renderer, navigation, menu, quick-ask", run: "node scripts/verify-all.mjs --serial renderer navigation menu quick-ask" }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # typecheck, not build: the same tsc -b over the packages AND the apps,
      # whose dist/domain the desk and the journeys read. Shards that built
      # only the packages skipped four apps' journeys and lost the desk.
      - run: pnpm typecheck

      # quick-ask and a few others walk all three engines, so every shard has them.
      # The browsers are cached by the pinned Playwright version: a fresh
      # download of all three took 42 of a job's 45 minutes on 2026-10-22.
      # Their system libraries are installed every time (install-deps).
      - name: The engines, cached
        id: engines-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: The engines
        run: npx playwright install --with-deps chromium webkit firefox
      # Saved the moment they are installed: a cache saved after the job is
      # never saved when the job runs out of time, which is when it matters.
      - name: The engines, kept
        if: steps.engines-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # The GPU path's Chromium: Google Chrome as it ships, which has element
      # capture behind its flag; engine.mjs switches it on with SwiftShader.
      # Chrome 155 draws on the DOM path all the same (see the top of this file).
      - name: Google Chrome, for the GPU path
        if: matrix.renderer == 'gpu'
        run: |
          npx playwright install --with-deps chrome
          echo "GRAVIEW_BROWSER=$(command -v google-chrome-stable || echo /opt/google/chrome/chrome)" >> "$GITHUB_ENV"

      # panning and scale time frames against a GPU this runner does not
      # have, and shrunk needs Chrome Canary — they hold on a real machine,
      # through `pnpm verify` there. Journeys two-wide on a two-core runner.
      - name: ${{ matrix.shard }}
        env:
          GRAVIEW_JOURNEYS_PARALLEL: "2"
          GRAVIEW_RENDERER: ${{ matrix.renderer }}
        run: ${{ matrix.run }}

      - name: The verdicts, for reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.renderer }}-${{ strategy.job-index }}
          path: |
            docs/*.json
            docs/watch/
          if-no-files-found: ignore

  engines:
    if: github.event.schedule == '17 9 * * 1' || inputs.engines
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The browsers are cached by the pinned Playwright version: a fresh
      # download of all three took 42 of a job's 45 minutes on 2026-10-22.
      # Their system libraries are installed every time (install-deps).
      - name: The engines, cached
        id: engines-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: The engines, kept
        if: steps.engines-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # A cell that fails is looked at again alone; one that held the second
      # time is written to docs/flakes.json and raised as a warning.
      - run: pnpm engines

      # The matrix, each engine's own reports (docs/engines/<engine>/) and the
      # survey's shots, so a failing cell names its screen.
      - name: The verdicts, for reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-engines
          path: |
            docs/*.json
            docs/engines/
            docs/survey/
            docs/watch/
          if-no-files-found: ignore
