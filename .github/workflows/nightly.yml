# The browser harnesses, every night, and red when a claim stops holding.
#
# CI on a push runs the tests, the checker, the tarballs, the scaffold and
# the progression. The rest of the harness chain — every screen judged by
# the watch, the site, the pages face at phone width, the survey, the audit
# — ran only when somebody remembered to, and a red verdict sat in
# docs/*.json for days: the site's kit check broke on main on 2026-09-29 and
# nobody heard until a walk's review a day later. This is the run nobody has
# to remember, and the release workflow will not publish while it is red.
#
# Chromium every night, across six runners at once; WebKit and Firefox
# once a week, through `pnpm engines`, on a runner of their own. `shrunk`, `panning` and `scale` are left out: the GPU capture
# path needs Chrome Canary, and the other two time frames against a GPU the
# runner does not have.

name: Nightly

on:
  schedule:
    - cron: "17 7 * * *"
    # Monday's run also takes the other two engines.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      engines:
        description: "Also run pnpm engines (WebKit and Firefox)"
        type: boolean
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # SIX RUNNERS SIDE BY SIDE, not one: one two-core runner taking every
  # harness in turn was 54 minutes of harness after setup, and a nightly
  # nobody can wait for is one nobody kicks off before a release. Each shard
  # is its own machine, so its ports and its CPU are its own and nothing
  # starves a frame; within a shard the harnesses still run one at a time.
  # Shards are balanced by the 2026-10-03 run's times (gauntlet 646s, site
  # 468s, journeys 1111s across its five apps); the slowest is ~11 minutes.
  harnesses:
    name: ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: gauntlet, chat, menu
            run: node scripts/verify-all.mjs --serial gauntlet chat menu
          - shard: site, audit
            run: node scripts/verify-all.mjs --serial site audit
          - shard: survey, create, pages, seat-guide, navigation
            run: node scripts/verify-all.mjs --serial survey create pages seat-guide navigation
          - shard: rota, lines, calendar, desk, remember, studio, watch, who, seat, rehearsal
            run: node scripts/verify-all.mjs --serial rota lines calendar desk remember studio watch who seat rehearsal
          - shard: journeys (gauntlet)
            run: node scripts/verify-journeys.mjs gauntlet
          - shard: journeys (todo, seedbed, rota, discography)
            run: node scripts/verify-journeys.mjs todo seedbed rota discography
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # typecheck, not build: the same tsc -b over the packages AND the apps,
      # whose dist/domain the desk and the journeys read. Shards that built
      # only the packages skipped four apps' journeys and lost the desk.
      - run: pnpm typecheck

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # panning and scale time frames against a GPU this runner does not
      # have, and shrunk needs Chrome Canary — they hold on a real machine,
      # through `pnpm verify` there. Journeys two-wide on a two-core runner.
      - name: ${{ matrix.shard }}
        env:
          GRAVIEW_JOURNEYS_PARALLEL: "2"
        run: ${{ matrix.run }}

      - name: The verdicts, for reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ strategy.job-index }}
          path: |
            docs/*.json
            docs/watch/
          if-no-files-found: ignore

  engines:
    if: github.event.schedule == '17 9 * * 1' || inputs.engines
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: pnpm engines
